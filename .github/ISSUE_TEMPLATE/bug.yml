name: バグ
description: 期待と異なる動作。修正は回帰テスト付きで 1 PR
title: "fix: "
labels: ["type:bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
      description: エラーメッセージ・スクリーンショット・ログ（認証情報や顧客の個人情報は貼らない）
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      value: |
        - [ ] 再現手順を失敗する回帰テストとして追加し、修正後に通る
        - [ ] 検証コマンドがすべて通る
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 触るファイル（分かる範囲で）
  - type: textarea
    id: verify
    attributes:
      label: 検証コマンド
      value: |
        npm run test
